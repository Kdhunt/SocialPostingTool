name: ward-communications-hub

services:
  postgres:
    image: postgres:16-alpine
    container_name: ward-comms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ward_comms
      POSTGRES_PASSWORD: ward_comms_dev_password
      POSTGRES_DB: ward_comms_dev
    ports:
      - '5432:5432'
    volumes:
      - ward-comms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ward_comms -d ward_comms_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ward-comms-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ward-comms-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ward-comms-postgres-data:
  ward-comms-redis-data:
